<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phones Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#242a33; --txt:#e6edf3;
    --dim:#8b949e; --green:#3fb950; --amber:#d29922; --gray:#565d66;
    --blue:#58a6ff; --blue-btn:#1f6feb; --blue-hover:#388bfd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
       padding:28px;max-width:700px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  h1{font-size:22px;font-weight:600;letter-spacing:-0.02em}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:18px 20px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s}
  .card:hover{border-color:#38444d}
  .row-top{display:flex;align-items:center;gap:14px}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .dot.gray{background:var(--gray)} .dot.green{background:var(--green);box-shadow:0 0 8px rgba(63,185,80,0.4)}
  .dot.amber{background:var(--amber);box-shadow:0 0 8px rgba(210,153,34,0.4)}
  .i{flex:1;min-width:0}
  .i .nm{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:500}
  .badge.adb{background:#23863633;color:var(--green);border:1px solid #23863666}
  .badge.agent{background:#1f6feb33;color:var(--blue);border:1px solid #1f6feb66}
  .i .ip{color:var(--dim);font-size:12px;margin-top:2px;font-family:monospace}
  .i .stats{color:var(--dim);font-size:12px;margin-top:4px}
  .i .msg{font-size:13px;margin-top:2px}
  .msg.ok{color:var(--green)} .msg.warn{color:var(--amber)} .msg.off{color:var(--dim)}
  .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{border:0;border-radius:8px;padding:8px 14px;font:600 13px system-ui;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,opacity .15s}
  .btn.dim{background:#21262d;color:var(--txt);border:1px solid var(--line)}
  .btn.dim:hover{background:#30363d}
  .btn.primary{background:var(--blue-btn);color:#fff}
  .btn.primary:hover{background:var(--blue-hover)}
  .btn.ok{background:#238636;color:#fff} .btn.ok:hover{background:#2ea043}
  .btn.warn{background:#9e6a03;color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  
  /* Snapshot Preview Box */
  .shot-box{border-top:1px solid var(--line);padding-top:14px;display:none;flex-direction:column;align-items:center;gap:10px}
  .shot-box.open{display:flex}
  .shot-img-wrap{max-width:320px;width:100%;background:#090d12;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center;position:relative}
  .shot-img{width:100%;height:auto;display:block;object-fit:contain}
  .shot-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:320px;font-size:12px;color:var(--dim)}
  .shot-bar a{color:var(--blue);text-decoration:none}
  .shot-bar a:hover{text-decoration:underline}

  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>
<body>
  <header>
    <h1>Phones Dashboard</h1>
    <span id="clock" class="sub" style="margin-bottom:0"></span>
  </header>
  <div class="sub">Local controller &middot; Scrcpy Mirroring &middot; Live Snapshots &middot; Auto-rearm</div>
  
  <div id="list"></div>
  <div class="foot">Auto-refreshing status every 3&nbsp;s &middot; Ready on localhost</div>

<script>
const list = document.getElementById('list');
const openShots = {}; // tracks which phone preview boxes are toggled open

function dot(c){ return '<span class="dot '+c.dot+'"></span>'; }

function card(p){
  const isOpen = !!openShots[p.name];
  let btns = '';
  
  if (p.state === 'offline') {
    btns = '<button class="btn ok" onclick="act(\''+p.name+'\',\'connect\',this)">Connect</button>';
    btns += '<button class="btn dim" title="Re-arm wireless debugging over agent" onclick="act(\''+p.name+'\',\'rearm\',this)">🔄 Rearm</button>';
  } else if (p.state === 'authorize') {
    btns = '<button class="btn warn" onclick="act(\''+p.name+'\',\'retry\',this)">Allow on phone</button>';
    btns += '<button class="btn dim" onclick="act(\''+p.name+'\',\'rearm\',this)">🔄 Rearm</button>';
  } else {
    // Connected / Agent Active
    btns = '<button class="btn primary" onclick="act(\''+p.name+'\',\'view\',this)">🖥️ Mirror Screen</button>';
    btns += '<button class="btn dim" onclick="toggleShot(\''+p.name+'\')">📸 '+(isOpen?'Hide Shot':'Live Snapshot')+'</button>';
    btns += '<button class="btn dim" title="Re-enable wireless debugging" onclick="act(\''+p.name+'\',\'rearm\',this)">🔄 Rearm</button>';
  }

  let badges = '';
  if (p.hasAdb) badges += '<span class="badge adb">ADB</span> ';
  if (p.hasAgent) badges += '<span class="badge agent">Agent</span> ';

  let stats = '';
  if (p.state === 'connected') {
    const parts = [];
    if (p.battery && p.battery !== '?') parts.push('⚡ Battery ' + p.battery);
    if (p.screen && p.screen !== '?') parts.push('Screen ' + p.screen);
    if (p.wifi && p.wifi !== '?') parts.push('Wi‑Fi ' + p.wifi);
    stats = parts.join(' &middot; ');
  }

  const shotSrc = isOpen ? ('/api/shot?name=' + encodeURIComponent(p.name) + '&t=' + (openShots[p.name] || Date.now())) : '';

  return '<div class="card" id="card-'+p.name+'">'+
         '<div class="row-top">'+dot(p)+
         '<div class="i">'+
           '<div class="nm">'+p.name+' '+badges+'</div>'+
           (p.ip?'<div class="ip">'+p.ip+'</div>':'')+
           (stats?'<div class="stats">'+stats+'</div>':'')+
           '<div class="msg '+(p.state==='offline'?'off':p.state==='authorize'?'warn':'ok')+'">'+p.msg+'</div>'+
         '</div>'+
         '<div class="actions">'+btns+'</div>'+
         '</div>'+
         '<div class="shot-box '+(isOpen?'open':'')+'" id="shot-box-'+p.name+'">'+
           '<div class="shot-img-wrap">'+
             (isOpen ? '<img class="shot-img" src="'+shotSrc+'" alt="Screenshot" onload="this.style.opacity=1" onerror="this.alt=\'Snapshot unavailable\'" style="opacity:0.8;transition:opacity .2s"/>' : '')+
           '</div>'+
           '<div class="shot-bar">'+
             '<button class="btn dim" style="padding:4px 8px;font-size:11px" onclick="refreshShot(\''+p.name+'\')">🔄 Refresh Shot</button>'+
             (isOpen ? '<a href="'+shotSrc+'" target="_blank">Open Full Image ↗</a>' : '')+
           '</div>'+
         '</div>'+
         '</div>';
}

function toggleShot(name){
  if (openShots[name]) {
    delete openShots[name];
  } else {
    openShots[name] = Date.now();
  }
  refresh();
}

function refreshShot(name){
  openShots[name] = Date.now();
  refresh();
}

async function refresh(){
  try{
    const r = await fetch('/api/status'); 
    const a = await r.json();
    list.innerHTML = a.map(card).join('');
  }catch(e){ 
    list.innerHTML = '<div class="card"><div class="msg warn">Backend server unreachable. Make sure control-web.bat is running.</div></div>'; 
  }
}

async function act(name, action, btn){
  btn.disabled = true; 
  const orig = btn.textContent;
  btn.textContent = '...';
  try{ 
    const r = await fetch('/api/action?name='+encodeURIComponent(name)+'&action='+encodeURIComponent(action));
    const data = await r.json();
    if (action === 'rearm' && data.result) {
      alert('[' + name + '] ' + data.result);
    }
  }catch(e){}
  setTimeout(refresh, 600);
}

setInterval(()=>{ const d=new Date(); clock.textContent=d.toLocaleTimeString(); },1000);
refresh(); 
setInterval(refresh, 3000);
</script>
</body>
</html>
